# ─────────────────────────────────────────────────────────────
# 『인공지능 구조 원리 교과서』 점검 대상 링크
#
# 이 파일이 유일한 원본이다. 사이트 섹션 2와 링크 체커가 함께 읽는다.
# 사이트 HTML을 직접 고치지 말고 이 파일을 고칠 것.
#
# url: null  → 아직 본문 원문과 대조하지 않은 항목. 체커는 건너뛰고
#              '원문 대조 필요'로 보고한다. 게시 전에 모두 채울 것.
# expect_block: true
#            → 자동화 요청을 차단하는 사이트. 어떤 응답이 오든
#              실패로 처리하지 않고 '자동 판정 불가'로만 기록한다.
#              (네이버·아마존 등. 거짓 경보가 반복되면 결국 알림을
#               무시하게 되므로 처음부터 판정 대상에서 뺀다.)
# manual: <주기>
#            → 사람이 직접 열어 확인해야 하는 항목. STATUS의
#              '실환경 점검'에 집계된다.
# ─────────────────────────────────────────────────────────────

meta:
  book: 인공지능 구조 원리 교과서
  edition: 1판 3쇄
  site: https://mlfundamentals.github.io/ai-structure/
  updated: 2026-09-06

defaults:
  timeout: 20
  retries: 2
  user_agent: >-
    Mozilla/5.0 (compatible; ai-structure-linkcheck/1.0;
    +https://mlfundamentals.github.io/ai-structure/)

# ═══ 본문 실습 (사이트 섹션 1) ═══════════════════════════════
# 6건 모두 네이버 단축 URL이다. 네이버는 데이터센터 IP의 자동화
# 요청을 차단하므로 GitHub Actions 러너에서는 정상 여부를 판정할
# 수 없다. 그래서 전부 expect_block + manual 로 둔다.
#
# ⚠ 리다이렉트 최종 주소를 반드시 채울 것. 단축 서비스가 종료되면
#   이 기록이 실습 자료에 접근할 유일한 경로다. 본문에는 단축
#   주소만 인쇄돼 있다. 사람이 브라우저에서 열어 주소창을 복사해
#   resolved 에 적는다.

