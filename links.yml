# ─────────────────────────────────────────────────────────────
# 『인공지능 구조 원리 교과서』 점검 대상 링크
#
# 이 파일이 유일한 원본이다. 사이트 섹션 2와 링크 체커가 함께 읽는다.
# 사이트 HTML을 직접 고치지 말고 이 파일을 고칠 것.
#
# url: null  → 아직 본문 원문과 대조하지 않은 항목. 체커는 건너뛰고
#              '원문 대조 필요'로 보고한다. 게시 전에 모두 채울 것.
# expect_block: true
#            → 자동화 요청을 차단하는 사이트. 어떤 응답이 오든
#              실패로 처리하지 않고 '자동 판정 불가'로만 기록한다.
#              (네이버·아마존 등. 거짓 경보가 반복되면 결국 알림을
#               무시하게 되므로 처음부터 판정 대상에서 뺀다.)
# manual: <주기>
#            → 사람이 직접 열어 확인해야 하는 항목. STATUS의
#              '실환경 점검'에 집계된다.
# ─────────────────────────────────────────────────────────────

