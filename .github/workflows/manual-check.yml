name: 분기 실전 점검 알림

# ─────────────────────────────────────────────────────────────────────────────
# 사람이 직접 하는 점검을 잊지 않게 하는 장치.
#
# 링크 점검(주 1회)과 실습 실행 점검(월 1회)은 cron 이 알아서 돈다. 그런데
# STATUS 표의 세 번째 줄 「실환경 점검」은 사람이 브라우저와 Colab 을 직접
# 열어야 한다. 알림이 없으면 잊히고, 잊히면 없는 것과 같다.
#
# 하는 일은 하나다: 분기마다 깨어나 이슈를 연다.
# 이슈 본문은 checks/manual_checklist.md 를 그대로 옮긴 것이라, 점검 목록을
# 고칠 때 이 워크플로를 건드릴 필요가 없다.
#
# ⚠ 마지막 점검일을 data/status.json 의 manual.checked 에서 읽는다.
#   그 값이 곧 사이트 STATUS 표에 찍히는 날짜다. 하나뿐인 출처라
#   "사이트에는 최근으로 보이는데 알림은 계속 온다" 같은 어긋남이 생기지 않는다.
#   뒤집어 말하면 — 점검을 하고도 그 값을 안 고치면 이슈가 계속 열린다.
#   그게 맞다. 독자가 보는 날짜가 갱신되지 않았다면 점검은 끝난 것이 아니다.
#
# ⚠ 예약 실행은 저장소가 60일 조용하면 자동으로 멈춘다. 이 워크플로는 90일
#   주기라 혼자서는 스스로를 깨울 수 없다. 주간 링크 점검이 매주 data/ 를
#   커밋하며 저장소를 깨워 두고 있다. 그 워크플로를 끄면 이 알림도 조용해진다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 1·4·7·10월 1일 00:00 UTC = 09:00 KST
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      force:
        description: "마지막 점검이 최근이어도 이슈를 연다 (시험용)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  remind:
    name: 실환경 점검 이슈 열기
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 80일이 안 됐으면 열지 않는다. 막 끝낸 사람에게 또 열어 주면
      # 사람은 곧 이 알림 자체를 무시하게 된다.
      - name: 경과일 계산
        id: age
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, pathlib, sys

          p = pathlib.Path("data/status.json")
          last = None
          if p.exists():
              try:
                  last = (json.loads(p.read_text(encoding="utf-8"))
                          .get("manual", {}).get("checked"))
              except Exception:
                  last = None

          if not last:
              # 값이 없거나 파일이 깨졌다 — 조용히 넘기지 않고 반드시 알린다.
              print("days=9999")
              print("last=(기록 없음)")
              sys.exit(0)

          try:
              d = datetime.date.fromisoformat(last)
          except ValueError:
              print("days=9999")
              print(f"last=(형식 오류: {last})")
              sys.exit(0)

          print(f"days={(datetime.date.today() - d).days}")
          print(f"last={d.isoformat()}")
          PY

      - name: 이미 열린 이슈가 있는지 확인
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 라벨이 아직 없을 때(처음 실행) gh 가 오류를 낼 수 있다. 그때는 0으로 본다 —
          # 이슈가 하나 더 열리는 것보다 열려야 할 이슈가 안 열리는 쪽이 훨씬 나쁘다.
          n=$(gh issue list --label "실환경-점검" --state open --json number --jq 'length' 2>/dev/null || echo 0)
          echo "open_count=$n" >> "$GITHUB_OUTPUT"
          echo "열려 있는 점검 이슈: $n 개"

      - name: 이슈 열기
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.age.outputs.days }}
          LAST: ${{ steps.age.outputs.last }}
          OPEN_COUNT: ${{ steps.existing.outputs.open_count }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$OPEN_COUNT" != "0" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::이미 열린 점검 이슈가 $OPEN_COUNT 개 있다. 새로 열지 않는다."
            exit 0
          fi

          if [ "$DAYS" -lt 80 ] && [ "$FORCE" != "true" ]; then
            echo "::notice::마지막 점검이 ${DAYS}일 전($LAST)이다. 아직 이르므로 열지 않는다."
            exit 0
          fi

          gh label create "실환경-점검" \
            --color "0E8A16" \
            --description "사람이 직접 하는 분기 점검" 2>/dev/null || true

          {
            echo "마지막 실환경 점검: **${LAST}** · **${DAYS}일 전**"
            echo ""
            echo "---"
            echo ""
            cat checks/manual_checklist.md
          } > /tmp/body.md

          # ⚠ 이슈를 못 열면 요란하게 실패해야 한다. 이 알림 체계 전체가 이슈
          #   하나에 얹혀 있다. 조용히 넘어가면 분기마다 워크플로가 돌면서
          #   아무 이슈도 안 열리고 아무도 모른다.
          if ! url=$(gh issue create \
            --title "실환경 점검 ($(date -u +%Y-%m))" \
            --label "실환경-점검" \
            --body-file /tmp/body.md); then
            echo "::error::점검 이슈를 열지 못했다."
            echo "  먼저 볼 곳: Settings → Features → Issues 가 켜져 있는가."
            echo "  그다음: 이 워크플로의 permissions 에 issues:write 가 있는가."
            exit 1
          fi

          if [ -z "$url" ]; then
            echo "::error::gh 는 성공했다는데 이슈 주소가 비었다. 직접 확인할 것."
            exit 1
          fi

          echo "::notice::점검 이슈를 열었다 — $url"
