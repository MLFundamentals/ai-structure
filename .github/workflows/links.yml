name: 링크 점검

on:
  schedule:
    # 매주 월요일 09:00 KST (= 일요일 00:00 UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    paths:
      - "links.yml"
      - "checks/check_links.py"
      - ".github/workflows/links.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - name: 링크 점검
        id: check
        continue-on-error: true          # 소실이 있어도 결과는 커밋한다
        run: python checks/check_links.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "링크 점검 결과 갱신 ($(date +%F))"
          git push

      - name: 소실된 링크가 있으면 실패 처리
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::연결되지 않는 링크가 있습니다. 요약을 확인하세요."
          exit 1
